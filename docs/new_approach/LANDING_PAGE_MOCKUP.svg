<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1960" viewBox="0 0 1440 1960" role="img" aria-labelledby="title description">
  <title id="title">CareerBridge landing page visual mockup</title>
  <desc id="description">A desktop landing page concept in forest green, ivory, and gold. Students can get started with optional guidance, browse every area, or search for a known course or college. A bridge and branching paths represent exploration without pressure or a predetermined destination.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f34"/>
      <stop offset="1" stop-color="#1b5747"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d7e2d6"/>
      <stop offset="1" stop-color="#a8c1ad"/>
    </linearGradient>
    <clipPath id="heroArt">
      <path d="M804 171h570a22 22 0 0 1 22 22v453a22 22 0 0 1-22 22H804z"/>
    </clipPath>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18352d; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .ink { fill: #18352d; }
      .muted { fill: #60736a; }
      .white { fill: #fffdf7; }
      .gold { fill: #f2cf78; }
      .small { font-size: 13px; }
      .body { font-size: 16px; }
      .body-lg { font-size: 18px; }
      .section-title { font-size: 38px; font-weight: 600; letter-spacing: -1.5px; }
      .card-title { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.15px; }
    </style>
  </defs>

  <rect width="1440" height="1960" fill="#fbfaf6"/>

  <!-- Navigation -->
  <rect x="0" y="0" width="1440" height="90" fill="#fbfaf6"/>
  <path d="M80 55h34l-17-23z" fill="#1e5a48"/>
  <path d="M85 54h24M89 47h16" fill="none" stroke="#fbfaf6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="124" y="56" class="serif ink" font-size="24" font-weight="700" letter-spacing="-.5">CareerBridge</text>
  <text x="660" y="53" class="body muted">How it works</text>
  <text x="805" y="53" class="body muted">Browse options</text>
  <text x="951" y="53" class="body muted">About the information</text>
  <rect x="1180" y="22" width="180" height="46" rx="23" fill="#1e5a48"/>
  <text x="1270" y="51" class="body" fill="#fffdf7" text-anchor="middle" font-weight="700">Browse all areas</text>
  <path d="M80 90h1280" stroke="#e9e9df"/>

  <!-- Hero -->
  <rect x="0" y="90" width="1440" height="720" fill="#fbfaf6"/>
  <text x="80" y="207" class="label" fill="#9b6c2b">A PLACE TO BEGIN</text>
  <text x="80" y="293" class="serif ink" font-size="68" font-weight="700" letter-spacing="-3.4">No plan yet?</text>
  <text x="80" y="371" class="serif ink" font-size="68" font-weight="700" letter-spacing="-3.4">You can still explore.</text>
  <text x="82" y="426" class="body-lg muted">Explore study options by interest, class, or course.</text>
  <text x="82" y="455" class="body-lg muted">You don’t need to decide today.</text>
  <rect x="80" y="495" width="211" height="54" rx="27" fill="#1e5a48"/>
  <text x="185" y="529" class="body" fill="#fffdf7" text-anchor="middle" font-weight="700">Choose how to browse</text>
  <text x="82" y="594" class="body muted">For students in Nagaland and the Northeast</text>
  <text x="82" y="622" class="body muted">— whether you know your next step or not.</text>

  <!-- Bridge illustration: place, path, and choices -->
  <g clip-path="url(#heroArt)">
    <rect x="804" y="171" width="592" height="497" fill="#e7eee6"/>
    <path d="M804 474c106-44 174-76 285-56 106 18 179-38 307-12v262H804z" fill="#c2d3c4"/>
    <path d="M804 542c105-29 182-8 269-49 90-43 203-47 323-13v188H804z" fill="url(#land)"/>
    <path d="M804 640c129-31 216-13 305-39 97-28 181-10 287 18v100H804z" fill="#83a68f"/>
    <circle cx="1268" cy="266" r="52" fill="#f2cf78"/>
    <path d="M811 483l75-100 71 91 89-148 101 151z" fill="#9bb6a4"/>
    <path d="M1020 482l104-133 87 108 90-105 99 128z" fill="#729783"/>
    <path d="M875 668c20-72 60-119 123-147 47-20 100-31 146-77 54-53 93-104 155-153" fill="none" stroke="#fbfaf6" stroke-width="30" stroke-linecap="round"/>
    <path d="M875 668c20-72 60-119 123-147 47-20 100-31 146-77 54-53 93-104 155-153" fill="none" stroke="#c28a3c" stroke-width="4" stroke-dasharray="2 15" stroke-linecap="round"/>
    <path d="M1060 537c-7-32-3-63 13-90 17-28 43-45 75-51" fill="none" stroke="#fbfaf6" stroke-width="24" stroke-linecap="round"/>
    <path d="M1133 396c20 4 38 14 51 30" fill="none" stroke="#c28a3c" stroke-width="3" stroke-dasharray="2 11" stroke-linecap="round"/>
    <g fill="#1e5a48">
      <path d="M849 551l30-71 30 71z"/><rect x="873" y="550" width="12" height="41"/>
      <path d="M916 568l25-58 25 58z"/><rect x="936" y="567" width="10" height="35"/>
      <path d="M1307 498l27-64 27 64z"/><rect x="1328" y="497" width="12" height="38"/>
    </g>
    <g fill="#f7f4e9">
      <rect x="863" y="533" width="7" height="10" rx="2"/><rect x="885" y="533" width="7" height="10" rx="2"/>
      <rect x="930" y="545" width="6" height="8" rx="2"/><rect x="947" y="545" width="6" height="8" rx="2"/>
      <rect x="1320" y="475" width="7" height="9" rx="2"/><rect x="1341" y="475" width="7" height="9" rx="2"/>
    </g>
    <g fill="#456f58">
      <circle cx="1005" cy="555" r="13"/><circle cx="1035" cy="546" r="10"/><circle cx="1252" cy="527" r="14"/>
    </g>
  </g>
  <rect x="804" y="171" width="592" height="497" rx="22" fill="none" stroke="#d7e1d7" stroke-width="2"/>
  <rect x="844" y="600" width="284" height="46" rx="23" fill="#fbfaf6"/>
  <circle cx="867" cy="623" r="6" fill="#c28a3c"/>
  <text x="884" y="628" class="small" font-weight="700">Your next step, at your pace</text>

  <!-- Entry choices -->
  <rect x="0" y="810" width="1440" height="390" fill="#f1f1e9"/>
  <text x="80" y="876" class="label" fill="#9b6c2b">START WHERE YOU ARE</text>
  <text x="80" y="929" class="section-title">Choose a way to explore.</text>
  <text x="80" y="962" class="body muted">All three are valid starting points. You can change direction whenever you like.</text>

  <rect x="80" y="1005" width="400" height="156" rx="16" fill="#1e5a48"/>
  <path d="M112 1045h28m-11-11 11 11-11 11" fill="none" stroke="#f2cf78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="1093" class="card-title" fill="#fffdf7">Help me get started</text>
  <text x="112" y="1123" class="body" fill="#e2ece4">Optional interests and class context.</text>
  <text x="112" y="1148" class="small" fill="#f2cf78" font-weight="700">No answers required  →</text>

  <rect x="520" y="1005" width="400" height="156" rx="16" fill="#fffdf7"/>
  <path d="M552 1045h28m-11-11 11 11-11 11" fill="none" stroke="#1e5a48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="552" y="1093" class="card-title">Browse all areas</text>
  <text x="552" y="1123" class="body muted">See every option in a neutral order.</text>
  <text x="552" y="1148" class="small" fill="#1e5a48" font-weight="700">Explore without a profile  →</text>

  <rect x="960" y="1005" width="400" height="156" rx="16" fill="#fffdf7"/>
  <path d="M992 1045h28m-11-11 11 11-11 11" fill="none" stroke="#1e5a48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="992" y="1093" class="card-title">I know what to search</text>
  <text x="992" y="1123" class="body muted">Look up a course or college by name.</text>
  <text x="992" y="1148" class="small" fill="#1e5a48" font-weight="700">Search the catalogue  →</text>

  <!-- How it works -->
  <rect x="0" y="1200" width="1440" height="325" fill="#fbfaf6"/>
  <text x="80" y="1272" class="section-title">A bridge, not a test.</text>
  <text x="80" y="1310" class="body-lg muted">CareerBridge helps you see possible next steps. You remain in control.</text>
  <path d="M146 1414H1279" stroke="#c7d4ca" stroke-width="4"/>
  <circle cx="167" cy="1414" r="13" fill="#1e5a48"/>
  <circle cx="718" cy="1414" r="13" fill="#1e5a48"/>
  <circle cx="1265" cy="1414" r="13" fill="#c28a3c"/>
  <text x="120" y="1376" class="card-title">Choose how to browse</text>
  <text x="120" y="1455" class="body muted">Start with interests, your class,</text>
  <text x="120" y="1480" class="body muted">a search—or no answers at all.</text>
  <text x="670" y="1376" class="card-title">Explore the options</text>
  <text x="670" y="1455" class="body muted">See study areas and courses</text>
  <text x="670" y="1480" class="body muted">without “best match” rankings.</text>
  <text x="1130" y="1376" class="card-title">Check the details</text>
  <text x="1130" y="1455" class="body muted">Review colleges, sources,</text>
  <text x="1130" y="1480" class="body muted">requirements, and unknowns.</text>

  <!-- Trust section -->
  <rect x="0" y="1525" width="1440" height="300" fill="#e8eee7"/>
  <path d="M80 1525h690v300H80z" fill="#d9e5db"/>
  <text x="120" y="1600" class="label" fill="#9b6c2b">YOUR CHOICES STAY YOURS</text>
  <text x="120" y="1650" class="serif ink" font-size="39" font-weight="700" letter-spacing="-1.4">Suggestions open doors.</text>
  <text x="120" y="1692" class="serif ink" font-size="39" font-weight="700" letter-spacing="-1.4">They don’t choose for you.</text>
  <text x="120" y="1741" class="body muted">Interest links are just places to explore—not eligibility advice</text>
  <text x="120" y="1767" class="body muted">or a decision about your future.</text>
  <text x="830" y="1607" class="card-title">Clear information, honestly shown</text>
  <text x="830" y="1650" class="body muted">Course and college details should link to their sources.</text>
  <text x="830" y="1679" class="body muted">If fees or requirements aren’t confirmed, we say so.</text>
  <text x="830" y="1734" class="small" fill="#1e5a48" font-weight="700">How we handle information  →</text>

  <!-- Closing CTA and footer -->
  <rect x="0" y="1825" width="1440" height="135" fill="url(#forest)"/>
  <text x="80" y="1884" class="serif white" font-size="36" font-weight="700" letter-spacing="-1.2">You can begin without having it all figured out.</text>
  <text x="80" y="1921" class="body" fill="#dce8df">Take one small step. Keep every other option open.</text>
  <rect x="1082" y="1860" width="278" height="54" rx="27" fill="#f2cf78"/>
  <text x="1221" y="1894" class="body" fill="#18352d" text-anchor="middle" font-weight="700">Browse options</text>
  <text x="80" y="1947" class="small" fill="#dce8df">CareerBridge · Explore at your own pace</text>
</svg>
