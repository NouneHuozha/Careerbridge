<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title description">
  <title id="title">CareerBridge User Type 1 journey</title>
  <desc id="description">A student can begin with class-first Discovery, use Guided Explorer with optional class and activity questions, browse all areas without answering, or search the public catalogue. Both Discovery routes lead to broad Results; course and college details are available only when verified records exist. Public pages work without session state, and recovery links remain available.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#46645a"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#b7792f"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #20352d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52665e; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #62776d; }
      .node-title { font-size: 21px; font-weight: 700; }
      .node-copy { font-size: 15px; fill: #52665e; }
      .small { font-size: 13px; fill: #52665e; }
      .number { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .card { fill: #fff; stroke: #d7dfd9; stroke-width: 2; }
      .green-card { fill: #eaf2ed; stroke: #739282; stroke-width: 2; }
      .gold-card { fill: #fbf1df; stroke: #c8954e; stroke-width: 2; }
      .blue-card { fill: #edf2f7; stroke: #8ca3b8; stroke-width: 2; }
      .line { fill: none; stroke: #46645a; stroke-width: 3; marker-end: url(#arrow); }
      .gold-line { fill: none; stroke: #b7792f; stroke-width: 3; marker-end: url(#arrowGold); }
      .dashed { fill: none; stroke: #789087; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .pill { fill: #f0f3f0; stroke: #d7dfd9; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1500" fill="#f7f6f1"/>
  <text x="80" y="65" class="label">CAREERBRIDGE · USER TYPE 1</text>
  <text x="80" y="112" class="title">A clear way forward—even when you're unsure</text>
  <text x="80" y="145" class="subtitle">Choose a class for direct Discovery, use optional guided questions, or browse all areas.</text>

  <text x="80" y="205" class="label">1 · CHOOSE HOW TO BEGIN</text>
  <rect x="530" y="225" width="540" height="95" rx="18" class="green-card"/>
  <circle cx="570" cy="272" r="20" fill="#285642"/>
  <text x="570" y="277" class="number">1</text>
  <text x="610" y="266" class="node-title">Landing page</text>
  <text x="610" y="293" class="node-copy">Pick a starting point—or browse directly.</text>

  <path d="M690 320 V354 H280 V380" class="line"/>
  <path d="M800 320 V380" class="line"/>
  <path d="M910 320 V354 H1320 V380" class="line"/>

  <rect x="80" y="380" width="400" height="150" rx="16" class="card"/>
  <text x="110" y="420" class="label">A · START WITH NO IDEA</text>
  <text x="110" y="456" class="node-title">Discovery</text>
  <text x="110" y="484" class="node-copy">Choose a class to unlock optional activity picks.</text>
  <text x="110" y="508" class="small">“I’m not sure” is a valid starting point.</text>

  <rect x="600" y="380" width="400" height="150" rx="16" class="card"/>
  <text x="630" y="420" class="label">B · BROWSE INTEREST AREAS</text>
  <text x="630" y="456" class="node-title">Browse all areas</text>
  <text x="630" y="484" class="node-copy">Every area, in neutral order.</text>
  <text x="630" y="508" class="small">No answers or class selection needed.</text>

  <rect x="1120" y="380" width="400" height="150" rx="16" class="blue-card"/>
  <text x="1150" y="420" class="label">C · KNOW WHAT TO SEARCH</text>
  <text x="1150" y="456" class="node-title">Catalogue search</text>
  <text x="1150" y="484" class="node-copy">Search published course or college records.</text>
  <text x="1150" y="508" class="small">Only enable when verified records are ready.</text>

  <path d="M280 530 V585" class="line"/>
  <path d="M480 455 H535 V655 H600" class="line"/>
  <rect x="80" y="585" width="400" height="135" rx="16" class="gold-card"/>
  <text x="110" y="625" class="label">OPTIONAL · NEVER A GATE</text>
  <text x="110" y="660" class="node-title">Guided Explorer</text>
  <text x="110" y="684" class="node-copy">Self-guided route: /counselling</text>
  <text x="110" y="706" class="small">Skip class or activities; browse all areas anytime.</text>

  <rect x="600" y="585" width="460" height="135" rx="16" class="card"/>
  <text x="630" y="625" class="label">CLASS-FIRST DISCOVERY</text>
  <text x="630" y="661" class="node-title">Class 10 · Class 12 · “I’m not sure”</text>
  <text x="630" y="690" class="node-copy">Then pick up to 3 activities—or none.</text>
  <text x="630" y="710" class="small">Browse all areas is always available.</text>

  <rect x="1120" y="585" width="400" height="135" rx="16" class="blue-card"/>
  <text x="1150" y="625" class="label">SEARCH IS A SEPARATE ROUTE</text>
  <text x="1150" y="661" class="node-title">Public search result</text>
  <text x="1150" y="690" class="node-copy">Opens the course or college page.</text>
  <text x="1150" y="710" class="small">No Discovery answers needed.</text>

  <path d="M480 653 H545 V785 H700" class="gold-line"/>
  <path d="M800 530 H1080 V760 H850 V785" class="line"/>
  <path d="M830 720 V760 H850 V785" class="line"/>
  <path d="M1320 530 V560" class="dashed"/>

  <text x="80" y="770" class="label">2 · SHARED RESULTS</text>
  <rect x="540" y="785" width="520" height="155" rx="18" class="green-card"/>
  <circle cx="580" cy="830" r="20" fill="#285642"/>
  <text x="580" y="835" class="number">2</text>
  <text x="620" y="826" class="node-title">Areas to explore</text>
  <text x="580" y="870" class="node-copy">Activity picks suggest places to explore—not a match.</text>
  <text x="580" y="898" class="node-copy">Browse every area. No eligibility claims or verified listings yet.</text>
  <text x="580" y="923" class="small">If no class is chosen, keep the view general.</text>

  <path d="M800 940 V970 H280 V1000" class="line"/>
  <path d="M800 940 V1000" class="line"/>
  <path d="M800 970 H1320 V1000" class="line"/>

  <text x="80" y="982" class="label">3 · BROWSE A PUBLIC CATALOGUE</text>
  <rect x="80" y="1000" width="400" height="145" rx="16" class="card"/>
  <text x="110" y="1040" class="label">CLASS 10 VIEW</text>
  <text x="110" y="1076" class="node-title">Study categories</text>
  <text x="110" y="1105" class="node-copy">Verified stream and next-study options.</text>

  <rect x="600" y="1000" width="400" height="145" rx="16" class="card"/>
  <text x="630" y="1040" class="label">CLASS 12 VIEW</text>
  <text x="630" y="1076" class="node-title">Course areas</text>
  <text x="630" y="1105" class="node-copy">Published courses and verified details.</text>

  <rect x="1120" y="1000" width="400" height="145" rx="16" class="card"/>
  <text x="1150" y="1040" class="label">GENERAL VIEW</text>
  <text x="1150" y="1076" class="node-title">All areas / all colleges</text>
  <text x="1150" y="1105" class="node-copy">No class assumed; all routes stay open.</text>

  <path d="M280 1145 V1190 H800 V1210" class="line"/>
  <path d="M800 1145 V1210" class="line"/>
  <path d="M1320 1145 V1190 H800 V1210" class="line"/>

  <text x="80" y="1190" class="label">4 · FOLLOW AN OPTION (OR STOP WHEN YOU HAVE ENOUGH)</text>
  <rect x="155" y="1210" width="350" height="125" rx="16" class="blue-card"/>
  <text x="185" y="1253" class="node-title">Course / option detail</text>
  <text x="185" y="1282" class="node-copy">Official requirements, sources, unknowns.</text>
  <text x="185" y="1308" class="small">A class label or interest is not eligibility.</text>

  <rect x="625" y="1210" width="350" height="125" rx="16" class="card"/>
  <text x="655" y="1253" class="node-title">College list</text>
  <text x="655" y="1282" class="node-copy">Filtered by the public course/route—or all.</text>
  <text x="655" y="1308" class="small">No verified listings? Browse all colleges.</text>

  <rect x="1095" y="1210" width="350" height="125" rx="16" class="green-card"/>
  <text x="1125" y="1253" class="node-title">College details</text>
  <text x="1125" y="1282" class="node-copy">Courses, admission, place, fees, contacts.</text>
  <text x="1125" y="1308" class="small">Unknown facts are labeled—not guessed.</text>

  <path d="M505 1272 H625" class="line"/>
  <path d="M975 1272 H1095" class="line"/>

  <rect x="80" y="1380" width="1440" height="78" rx="16" fill="#20352d"/>
  <text x="115" y="1412" font-size="15" font-weight="700" fill="#fff">RECOVERY IS ALWAYS AVAILABLE</text>
  <text x="115" y="1438" font-size="14" fill="#e1e9e3">Public links work without a session · Back keeps choices · Clear my choices removes them · Empty, no-match, and load-error states are explained separately</text>
</svg>
